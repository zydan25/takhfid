name: Extract ZIP to Repository Root

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/extract-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo 'No ZIP file found in repository root.'
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP into the same folder
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"
          ROOT_DIR="$(pwd)"
          TMP_DIR="$(mktemp -d)"

          echo "Extracting $ZIP_FILE into $ROOT_DIR"
          unzip -q -o "$ZIP_FILE" -d "$TMP_DIR"

          # Copy archive contents into the repository root so the extracted
          # files sit beside the ZIP file, while preserving directories.
          cp -a "$TMP_DIR"/. "$ROOT_DIR"/

          rm -rf "$TMP_DIR"

          echo 'Extraction completed.'
          find . -maxdepth 2 -type f | sort | head -200

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m "chore: extract ZIP contents [skip ci]"
          git push origin HEAD:main
